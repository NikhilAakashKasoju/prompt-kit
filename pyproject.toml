[project]
name = "prompt-kit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NikhilAakashKasoju", email = "nikhilaakashkasoju@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prompt-toolkit = "prompt_kit:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
